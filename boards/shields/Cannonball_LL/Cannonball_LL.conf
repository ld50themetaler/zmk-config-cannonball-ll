CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

CONFIG_ZMK_SLEEP=y



CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# USB and BLE Device Information identity (PID table: Obsidian Main/Memo/キーボード.md)
CONFIG_USB_DEVICE_VID=0x8884
CONFIG_USB_DEVICE_PID=0x0922
CONFIG_BT_DIS_PNP_VID=0x8884
CONFIG_BT_DIS_PNP_PID=0x0922

# ZMK Studio (最初からアンロック)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Prospector Scanner Status Advertisement
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Cannonball LL"
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=200
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=1000
